
<!DOCTYPE html>
<html>
<head>
    <title>Student Event Registration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            text-align: center;
            padding: 30px;
        }
        .container {
            background: white;
            max-width: 450px;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
        }
        input, select, button {
            width: 90%;
            padding: 12px;
            margin: 8px;
            box-sizing: border-box;
        }
        button {
            background: #4338ca;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Student Event Registration</h1>
        <p>Welcome to our college events portal!</p>

        <h3>Upcoming Event</h3>
        <p>Tech Fest 2026</p>
        <p>Date: 15 November 2026</p>

        <form id="registrationForm">
            <input type="text" placeholder="Student Name" required>
            <input type="text" placeholder="Roll Number" required>
            <input type="email" placeholder="Email Address" required>

            <select required>
                <option value="">Select Event</option>
                <option>Tech Fest</option>
                <option>Cultural Fest</option>
                <option>Sports Day</option>
            </select>

            <button type="submit">Register</button>
        </form>
        <p id="message"></p>
    </div>

    <script>
        document.getElementById("registrationForm")
        .addEventListener("submit", function(event) {
            event.preventDefault();
            document.getElementById("message").textContent =
                "Registration submitted successfully!";
        });
    </script>
</body>
</html>
